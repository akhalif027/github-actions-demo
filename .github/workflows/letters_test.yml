name: Adding Letter Check Test

on:
    pull_request:
        branches:
            - main


jobs:
    test:
        runs-on: ubuntu-latest
        defaults: 
            run:
                working-directory: github_actions

        strategy:
            matrix:
                python-version: [3.11]

        env:
            MODE: "dev"

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python 
              uses: actions/setup-python@v4
              with:
                python-version: $ {{matrix.python-version}}

            - name: Test App Code
              run: python test_main.py
            